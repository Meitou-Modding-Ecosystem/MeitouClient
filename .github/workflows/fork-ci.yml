name: Fork CI
on:
  pull_request:
    branches: [fork, release]
  push:
    branches: [fork, release]
permissions:
  contents: read
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-dotnet.yml@fc0507fb376b8b8ba732795c7032c9cd81464a58
    with:
      runner: windows-latest
      test-filter: Category!=Slow&Category!=Bench
